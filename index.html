<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Neural Network AR TLM</title>

<style>
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: Arial, sans-serif;
        background: #000;
    }

    canvas {
        display: block;
    }

    #info {
        position: fixed;
        top: 10px;
        left: 10px;
        right: 10px;
        z-index: 10;
        background: rgba(0,0,0,0.78);
        color: white;
        padding: 12px;
        border-radius: 12px;
        font-size: 14px;
        line-height: 1.4;
    }

    #startAR {
        position: fixed;
        bottom: 25px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 20;

        padding: 15px 25px;
        border: none;
        border-radius: 30px;

        background: #ffffff;
        color: #111;

        font-size: 17px;
        font-weight: bold;
    }

    #flowButton {
        position: fixed;
        bottom: 85px;
        left: 50%;
        transform: translateX(-50%);

        z-index: 20;

        padding: 11px 20px;
        border: none;
        border-radius: 25px;

        background: rgba(255,255,255,0.9);
        color: #111;

        font-size: 15px;
        display: none;
    }

    #status {
        margin-top: 5px;
        font-size: 13px;
        color: #ddd;
    }
</style>
</head>

<body>

<div id="info">
    <b>NEURAL NETWORK – AR TLM</b>
    <div id="status">
        Checking AR support...
    </div>
</div>

<button id="startAR">START AR</button>

<button id="flowButton">
    PAUSE DATA FLOW
</button>


<script type="module">

import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';


/* =========================================================
   BASIC THREE.JS SETUP
========================================================= */

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
    70,
    window.innerWidth / window.innerHeight,
    0.01,
    100
);

const renderer = new THREE.WebGLRenderer({
    antialias: true,
    alpha: true
});

renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);

renderer.xr.enabled = true;

document.body.appendChild(renderer.domElement);


/* =========================================================
   LIGHTING
========================================================= */

const light1 = new THREE.HemisphereLight(
    0xffffff,
    0xbbbbbb,
    1.5
);

scene.add(light1);

const light2 = new THREE.DirectionalLight(
    0xffffff,
    1.2
);

light2.position.set(2, 4, 2);

scene.add(light2);


/* =========================================================
   UI
========================================================= */

const startButton = document.getElementById("startAR");
const flowButton = document.getElementById("flowButton");
const statusText = document.getElementById("status");

let xrSession = null;
let hitTestSource = null;
let hitTestSourceRequested = false;

let placed = false;

let networkGroup = null;

let particles = [];

let flowRunning = true;


/* =========================================================
   CHECK AR SUPPORT
========================================================= */

async function checkARSupport() {

    if (!navigator.xr) {

        statusText.innerHTML =
            "❌ WebXR is not available in this browser.";

        startButton.style.display = "none";

        return;
    }

    try {

        const supported =
            await navigator.xr.isSessionSupported("immersive-ar");

        if (supported) {

            statusText.innerHTML =
                "✅ AR available. Tap START AR.";

        } else {

            statusText.innerHTML =
                "❌ Immersive AR is not supported on this device/browser.";

            startButton.style.display = "none";
        }

    } catch (error) {

        console.log(error);

        statusText.innerHTML =
            "❌ Could not check AR support.";
    }
}

checkARSupport();


/* =========================================================
   START AR
========================================================= */

startButton.addEventListener("click", async () => {

    try {

        /*
         IMPORTANT:
         hit-test is OPTIONAL now.
         Therefore lack of hit-test should NOT reject
         the entire AR session.
        */

        xrSession = await navigator.xr.requestSession(
            "immersive-ar",
            {
                optionalFeatures: [
                    "hit-test"
                ]
            }
        );


        renderer.xr.setReferenceSpaceType("local");

        await renderer.xr.setSession(xrSession);


        statusText.innerHTML =
            "AR started. Move your phone slowly over a table or floor.";


        startButton.style.display = "none";

        flowButton.style.display = "block";


        /*
         Try to obtain hit-test.
        */

        if (
            xrSession.enabledFeatures &&
            xrSession.enabledFeatures.includes("hit-test")
        ) {

            statusText.innerHTML =
                "✅ Surface detection available. Point at a flat surface and tap.";

            setupHitTest();

        } else {

            statusText.innerHTML =
                "⚠️ AR started, but surface detection is unavailable on this device.";

        }


        xrSession.addEventListener(
            "end",
            onSessionEnd
        );

    } catch (error) {

        console.error(error);

        statusText.innerHTML =
            "❌ AR could not start.<br>" +
            error.message;

        startButton.style.display = "block";
    }

});


/* =========================================================
   HIT TEST
========================================================= */

async function setupHitTest() {

    try {

        const viewerSpace =
            await xrSession.requestReferenceSpace("viewer");

        hitTestSource =
            await xrSession.requestHitTestSource({
                space: viewerSpace
            });

        hitTestSourceRequested = true;

    } catch (error) {

        console.error(
            "Hit test unavailable:",
            error
        );

        hitTestSource = null;
    }
}


/* =========================================================
   RETICLE
========================================================= */

const reticleGeometry =
    new THREE.RingGeometry(
        0.08,
        0.1,
        32
    );

const reticleMaterial =
    new THREE.MeshBasicMaterial({
        color: 0xffffff,
        transparent: true,
        opacity: 0.9
    });

const reticle =
    new THREE.Mesh(
        reticleGeometry,
        reticleMaterial
    );

reticle.rotation.x = -Math.PI / 2;

reticle.matrixAutoUpdate = false;

reticle.visible = false;

scene.add(reticle);


/* =========================================================
   TAP TO PLACE
========================================================= */

renderer.domElement.addEventListener(
    "touchend",
    function(event) {

        if (!xrSession) return;

        if (!hitTestSource) {

            statusText.innerHTML =
                "Surface detection is not available.";

            return;
        }

        if (!reticle.visible) {

            statusText.innerHTML =
                "No surface detected. Slowly move the phone over a flat surface.";

            return;
        }

        if (!placed) {

            createNeuralNetwork();

            networkGroup.position.setFromMatrixPosition(
                reticle.matrix
            );

            /*
             Make the network stand vertically.
            */

            networkGroup.rotation.y = 0;

            placed = true;

            reticle.visible = false;

            statusText.innerHTML =
                "Neural Network placed. Watch the data move through the layers.";
        }

    },
    false
);


/* =========================================================
   CREATE NEURAL NETWORK
========================================================= */

function createNeuralNetwork() {

    networkGroup = new THREE.Group();

    scene.add(networkGroup);


    /*
       LAYER POSITIONS
    */

    const layerX = [
        -1.8,
        -0.6,
        0.6,
        1.8
    ];


    /*
       NUMBER OF NEURONS
    */

    const neuronCounts = [
        4,
        5,
        4,
        2
    ];


    /*
       LAYER NAMES
    */

    const layerNames = [
        "INPUT LAYER",
        "HIDDEN LAYER 1",
        "HIDDEN LAYER 2",
        "OUTPUT LAYER"
    ];


    /*
       Layer colours
    */

    const layerColors = [
        0x00aaff,
        0xffa000,
        0xaa55ff,
        0x00cc66
    ];


    let allLayers = [];


    /* =====================================================
       CREATE NEURONS
    ===================================================== */

    for (
        let l = 0;
        l < neuronCounts.length;
        l++
    ) {

        const layer = [];

        const count =
            neuronCounts[l];

        const spacing = 0.55;

        const totalHeight =
            (count - 1) * spacing;


        for (
            let n = 0;
            n < count;
            n++
        ) {

            const geometry =
                new THREE.SphereGeometry(
                    0.16,
                    24,
                    24
                );

            const material =
                new THREE.MeshStandardMaterial({
                    color: layerColors[l],
                    emissive: layerColors[l],
                    emissiveIntensity: 0.35,
                    metalness: 0.1,
                    roughness: 0.35
                });


            const neuron =
                new THREE.Mesh(
                    geometry,
                    material
                );


            neuron.position.set(
                layerX[l],
                totalHeight / 2 -
                    n * spacing,
                0
            );


            networkGroup.add(neuron);

            layer.push(neuron);


            /*
               Number each neuron
            */

            const numberText =
                createText(
                    String(n + 1),
                    0.12,
                    0xffffff
                );

            numberText.position.set(
                layerX[l],
                totalHeight / 2 -
                    n * spacing,
                0.19
            );

            networkGroup.add(
                numberText
            );
        }


        allLayers.push(layer);


        /*
           Layer heading
        */

        const heading =
            createText(
                layerNames[l],
                0.16,
                layerColors[l]
            );

        heading.position.set(
            layerX[l],
            1.15,
            0
        );

        networkGroup.add(heading);
    }


    /* =====================================================
       CONNECTIONS
    ===================================================== */

    for (
        let l = 0;
        l < allLayers.length - 1;
        l++
    ) {

        const currentLayer =
            allLayers[l];

        const nextLayer =
            allLayers[l + 1];


        for (
            let a = 0;
            a < currentLayer.length;
            a++
        ) {

            for (
                let b = 0;
                b < nextLayer.length;
                b++
            ) {

                const start =
                    currentLayer[a].position.clone();

                const end =
                    nextLayer[b].position.clone();


                const points = [
                    start,
                    end
                ];


                const geometry =
                    new THREE.BufferGeometry()
                        .setFromPoints(points);


                const material =
                    new THREE.LineBasicMaterial({
                        color: 0xaaaaaa,
                        transparent: true,
                        opacity: 0.28
                    });


                const line =
                    new THREE.Line(
                        geometry,
                        material
                    );


                networkGroup.add(line);
            }
        }
    }


    /* =====================================================
       DATA PARTICLES
    ===================================================== */

    createParticles(
        allLayers
    );


    /* =====================================================
       INPUT LABEL
    ===================================================== */

    const inputInfo =
        createText(
            "INPUT: IMAGE",
            0.15,
            0xffffff
        );

    inputInfo.position.set(
        -1.8,
        -1.2,
        0
    );

    networkGroup.add(
        inputInfo
    );


    /* =====================================================
       HIDDEN LAYER EXPLANATION
    ===================================================== */

    const hiddenInfo =
        createText(
            "FEATURE EXTRACTION",
            0.13,
            0xffffff
        );

    hiddenInfo.position.set(
        0,
        -1.2,
        0
    );

    networkGroup.add(
        hiddenInfo
    );


    /* =====================================================
       OUTPUT
    ===================================================== */

    const outputInfo =
        createText(
            "CAT 92%   DOG 8%",
            0.15,
            0xffffff
        );

    outputInfo.position.set(
        1.8,
        -1.2,
        0
    );

    networkGroup.add(
        outputInfo
    );


    /*
       Title
    */

    const title =
        createText(
            "NEURAL NETWORK",
            0.22,
            0xffffff
        );

    title.position.set(
        0,
        1.55,
        0
    );

    networkGroup.add(title);
}


/* =========================================================
   CREATE MOVING DATA
========================================================= */

function createParticles(
    layers
) {

    for (
        let l = 0;
        l < layers.length - 1;
        l++
    ) {

        const currentLayer =
            layers[l];

        const nextLayer =
            layers[l + 1];


        /*
           Create several particles
        */

        for (
            let p = 0;
            p < 4;
            p++
        ) {

            const particleGeometry =
                new THREE.SphereGeometry(
                    0.045,
                    12,
                    12
                );


            const particleMaterial =
                new THREE.MeshBasicMaterial({
                    color: 0xffffff
                });


            const particle =
                new THREE.Mesh(
                    particleGeometry,
                    particleMaterial
                );


            particle.userData = {

                layer: l,

                progress:
                    p / 4,

                speed:
                    0.006 + Math.random() * 0.003,

                from:
                    currentLayer[
                        Math.floor(
                            Math.random() *
                            currentLayer.length
                        )
                    ],

                to:
                    nextLayer[
                        Math.floor(
                            Math.random() *
                            nextLayer.length
                        )
                    ]
            };


            networkGroup.add(
                particle
            );

            particles.push(
                particle
            );
        }
    }
}


/* =========================================================
   TEXT CREATOR
========================================================= */

function createText(
    text,
    size,
    color
) {

    /*
       Use canvas texture so that
       labels work without external fonts.
    */

    const canvas =
        document.createElement("canvas");

    canvas.width = 1024;
    canvas.height = 256;


    const ctx =
        canvas.getContext("2d");


    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    ctx.fillStyle =
        "#" +
        new THREE.Color(color)
            .getHexString();


    ctx.font =
        "bold 90px Arial";

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";


    ctx.fillText(
        text,
        canvas.width / 2,
        canvas.height / 2
    );


    const texture =
        new THREE.CanvasTexture(
            canvas
        );


    texture.needsUpdate = true;


    const material =
        new THREE.SpriteMaterial({
            map: texture,
            transparent: true
        });


    const sprite =
        new THREE.Sprite(
            material
        );


    sprite.scale.set(
        size * 5,
        size * 1.25,
        1
    );


    return sprite;
}


/* =========================================================
   UPDATE PARTICLES
========================================================= */

function updateParticles() {

    if (!networkGroup) return;

    if (!flowRunning) return;


    particles.forEach(
        particle => {

            particle.userData.progress +=
                particle.userData.speed;


            if (
                particle.userData.progress >= 1
            ) {

                particle.userData.progress = 0;


                /*
                   Pick new neurons
                */

                const layer =
                    particle.userData.layer;


                const nextLayer =
                    layer + 1;


                particle.userData.from =
                    networkGroup.children
                        .find(
                            x =>
                            x ===
                            particle.userData.from
                        )
                        ||
                        particle.userData.from;
            }


            const from =
                particle.userData.from
                    .position;


            const to =
                particle.userData.to
                    .position;


            particle.position.lerpVectors(
                from,
                to,
                particle.userData.progress
            );
        }
    );
}


/* =========================================================
   FLOW BUTTON
========================================================= */

flowButton.addEventListener(
    "click",
    () => {

        flowRunning =
            !flowRunning;

        flowButton.innerText =
            flowRunning
                ? "PAUSE DATA FLOW"
                : "START DATA FLOW";
    }
);


/* =========================================================
   XR FRAME
========================================================= */

renderer.setAnimationLoop(
    function(
        timestamp,
        frame
    ) {

        if (
            frame &&
            xrSession
        ) {

            const referenceSpace =
                renderer.xr
                    .getReferenceSpace();


            /*
               Surface detection
            */

            if (
                hitTestSource &&
                !placed
            ) {

                const hitTestResults =
                    frame.getHitTestResults(
                        hitTestSource
                    );


                if (
                    hitTestResults.length > 0
                ) {

                    const hit =
                        hitTestResults[0];


                    const pose =
                        hit.getPose(
                            referenceSpace
                        );


                    if (pose) {

                        reticle.visible =
                            true;

                        reticle.matrix
                            .fromArray(
                                pose.transform
                                    .matrix
                            );
                    }

                } else {

                    reticle.visible =
                        false;
                }
            }
        }


        updateParticles();


        renderer.render(
            scene,
            camera
        );
    }
);


/* =========================================================
   SESSION END
========================================================= */

function onSessionEnd() {

    xrSession = null;

    hitTestSource = null;

    hitTestSourceRequested =
        false;

    placed = false;

    startButton.style.display =
        "block";

    flowButton.style.display =
        "none";

    statusText.innerHTML =
        "AR session ended.";
}


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);

</script>

</body>
</html>
