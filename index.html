<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no">

<title>Neural Network AR TLM</title>

<style>

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
    font-family: Arial, sans-serif;
}

/* LIVE CAMERA */
#camera {
    position: fixed;
    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    z-index: 1;

    transform: scaleX(-1);
}

/* THREE.JS CANVAS */
#threeCanvas {
    position: fixed;
    inset: 0;

    width: 100%;
    height: 100%;

    z-index: 2;

    pointer-events: none;
}

/* TITLE */
#title {
    position: fixed;

    top: 15px;
    left: 50%;

    transform: translateX(-50%);

    z-index: 10;

    padding: 10px 18px;

    border-radius: 12px;

    background: rgba(0,0,0,0.72);

    color: white;

    text-align: center;

    font-size: 20px;
    font-weight: bold;

    white-space: nowrap;
}

#subtitle {
    display: block;

    margin-top: 3px;

    font-size: 12px;

    font-weight: normal;
}

/* START BUTTON */
#startScreen {

    position: fixed;

    inset: 0;

    z-index: 30;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    background: #111820;

    color: white;

    text-align: center;
}

#startScreen h1 {
    font-size: 28px;
    margin-bottom: 8px;
}

#startScreen p {
    font-size: 15px;

    max-width: 300px;

    line-height: 1.5;

    opacity: 0.85;
}

#startButton {

    margin-top: 20px;

    padding: 16px 30px;

    border: none;

    border-radius: 30px;

    background: white;

    color: black;

    font-size: 17px;

    font-weight: bold;
}

/* INFORMATION */
#info {

    position: fixed;

    bottom: 20px;

    left: 50%;

    transform: translateX(-50%);

    z-index: 10;

    width: 88%;

    padding: 10px;

    border-radius: 12px;

    background: rgba(0,0,0,0.68);

    color: white;

    text-align: center;

    font-size: 13px;
}

</style>
</head>


<body>

<!-- CAMERA -->
<video id="camera"
       autoplay
       muted
       playsinline>
</video>


<!-- THREE.JS -->
<canvas id="threeCanvas"></canvas>


<!-- TITLE -->
<div id="title">

    NEURAL NETWORK

    <span id="subtitle">
        AI Teaching-Learning Material
    </span>

</div>


<!-- INFORMATION -->
<div id="info">
    Neural Network: Image → Features → Classification
</div>


<!-- START SCREEN -->
<div id="startScreen">

    <h1>NEURAL NETWORK</h1>

    <p>
        Interactive AR Teaching-Learning Material
        <br><br>
        The neural network will appear directly
        over your camera view.
    </p>

    <button id="startButton">
        START TLM
    </button>

</div>


<!-- THREE.JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>


<script>

/* =========================================================
   CAMERA
========================================================= */

const video =
    document.getElementById("camera");

const startScreen =
    document.getElementById("startScreen");

const startButton =
    document.getElementById("startButton");


async function startCamera() {

    try {

        const stream =
            await navigator.mediaDevices.getUserMedia({

                video: {
                    facingMode: {
                        ideal: "environment"
                    },

                    width: {
                        ideal: 1920
                    },

                    height: {
                        ideal: 1080
                    }
                },

                audio: false

            });

        video.srcObject = stream;

        await video.play();

        startScreen.style.display = "none";

        initThree();

    }

    catch(error) {

        alert(
            "Camera could not be started.\n\n" +
            "Please allow camera permission and reload the page."
        );

        console.error(error);

    }

}


startButton.addEventListener(
    "click",
    startCamera
);


/* =========================================================
   THREE.JS SETUP
========================================================= */

let scene;

let camera3D;

let renderer;

let networkGroup;

let packets = [];

let clock;


function initThree() {

    clock = new THREE.Clock();


    /* SCENE */

    scene =
        new THREE.Scene();


    /* CAMERA */

    camera3D =
        new THREE.PerspectiveCamera(

            45,

            window.innerWidth /
            window.innerHeight,

            0.1,

            100

        );


    /*
       IMPORTANT:

       The neural network is placed
       directly in front of the camera.
    */

    camera3D.position.set(
        0,
        0,
        8
    );


    /* RENDERER */

    renderer =
        new THREE.WebGLRenderer({

            canvas:
                document.getElementById(
                    "threeCanvas"
                ),

            alpha: true,

            antialias: true

        });


    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );


    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio,
            2
        )
    );


    /* LIGHT */

    const ambient =
        new THREE.AmbientLight(
            0xffffff,
            1.8
        );

    scene.add(ambient);


    const directional =
        new THREE.DirectionalLight(
            0xffffff,
            1.5
        );

    directional.position.set(
        2,
        5,
        8
    );

    scene.add(directional);


    /* NETWORK */

    createNeuralNetwork();


    /* RESIZE */

    window.addEventListener(
        "resize",
        resize
    );


    animate();

}


/* =========================================================
   NEURAL NETWORK
========================================================= */

function createNeuralNetwork() {

    networkGroup =
        new THREE.Group();


    /*
       Four layers:

       INPUT
       HIDDEN 1
       HIDDEN 2
       OUTPUT
    */


    const layers = [

        {
            name: "INPUT",
            count: 4,
            x: -3.8
        },

        {
            name: "HIDDEN 1",
            count: 5,
            x: -1.3
        },

        {
            name: "HIDDEN 2",
            count: 4,
            x: 1.3
        },

        {
            name: "OUTPUT",
            count: 2,
            x: 3.8
        }

    ];


    const layerNodes = [];


    /* CREATE NEURONS */

    layers.forEach(
        (layer, layerIndex) => {

            const nodes = [];

            const spacing = 1.05;

            const totalHeight =
                (layer.count - 1)
                * spacing;


            for (
                let i = 0;
                i < layer.count;
                i++
            ) {

                const y =
                    totalHeight / 2
                    - i * spacing;


                const neuron =
                    createNeuron(
                        layerIndex,
                        i
                    );


                neuron.position.set(
                    layer.x,
                    y,
                    0
                );


                networkGroup.add(
                    neuron
                );


                nodes.push(neuron);

            }


            layerNodes.push(nodes);


            /* LAYER LABEL */

            const label =
                createTextSprite(
                    layer.name,
                    0.42
                );


            label.position.set(
                layer.x,
                2.7,
                0
            );


            networkGroup.add(label);

        }
    );


    /* CONNECTIONS */

    for (
        let layer = 0;
        layer < layerNodes.length - 1;
        layer++
    ) {

        const current =
            layerNodes[layer];

        const next =
            layerNodes[layer + 1];


        current.forEach(
            nodeA => {

                next.forEach(
                    nodeB => {

                        const line =
                            createConnection(
                                nodeA.position,
                                nodeB.position
                            );

                        networkGroup.add(
                            line
                        );

                    }
                );

            }
        );

    }


    /* INPUT LABEL */

    const inputText =
        createTextSprite(
            "IMAGE DATA",
            0.32
        );

    inputText.position.set(
        -3.8,
        -2.5,
        0
    );

    networkGroup.add(
        inputText
    );


    /* FEATURES LABEL */

    const featureText =
        createTextSprite(
            "FEATURES",
            0.32
        );

    featureText.position.set(
        0,
        -2.5,
        0
    );

    networkGroup.add(
        featureText
    );


    /* OUTPUT RESULT */

    const result =
        createTextSprite(
            "CAT 92%   |   DOG 8%",
            0.35
        );

    result.position.set(
        3.8,
        -2.5,
        0
    );

    networkGroup.add(
        result
    );


    /* DATA FLOW ARROWS */

    createArrow(
        -2.5,
        1.9
    );

    createArrow(
        0,
        1.9
    );

    createArrow(
        2.5,
        1.9
    );


    /*
       DATA PACKETS

       These visibly move through
       the neural network.
    */

    createDataPacket(
        -3.8,
        -0.5,
        -1.3,
        0.4
    );

    createDataPacket(
        -1.3,
        0.4,
        1.3,
        -0.6
    );

    createDataPacket(
        1.3,
        -0.6,
        3.8,
        0.5
    );


    /*
       Overall position.

       The complete TLM appears
       directly in front of camera.
    */

    networkGroup.position.set(
        0,
        0,
        0
    );


    networkGroup.scale.set(
        0.85,
        0.85,
        0.85
    );


    scene.add(
        networkGroup
    );

}


/* =========================================================
   NEURON
========================================================= */

function createNeuron(
    layerIndex,
    index
) {

    const geometry =
        new THREE.SphereGeometry(
            0.27,
            24,
            24
        );


    let color;


    if (layerIndex === 0)
        color = 0x3498db;

    else if (layerIndex === 1)
        color = 0x9b59b6;

    else if (layerIndex === 2)
        color = 0xe67e22;

    else
        color = 0x2ecc71;


    const material =
        new THREE.MeshStandardMaterial({

            color: color,

            emissive: color,

            emissiveIntensity: 0.35,

            metalness: 0.15,

            roughness: 0.35

        });


    const neuron =
        new THREE.Mesh(
            geometry,
            material
        );


    /* NEURON NUMBER */

    const number =
        createTextSprite(
            String(index + 1),
            0.22
        );


    number.position.set(
        0,
        0,
        0.32
    );


    neuron.add(
        number
    );


    return neuron;

}


/* =========================================================
   CONNECTION
========================================================= */

function createConnection(
    start,
    end
) {

    const points = [

        new THREE.Vector3(
            start.x,
            start.y,
            start.z
        ),

        new THREE.Vector3(
            end.x,
            end.y,
            end.z
        )

    ];


    const geometry =
        new THREE.BufferGeometry()
        .setFromPoints(points);


    const material =
        new THREE.LineBasicMaterial({

            color: 0xaaaaaa,

            transparent: true,

            opacity: 0.38

        });


    return new THREE.Line(
        geometry,
        material
    );

}


/* =========================================================
   ARROW
========================================================= */

function createArrow(
    x,
    y
) {

    const direction =
        new THREE.Vector3(
            1,
            0,
            0
        );


    const arrow =
        new THREE.ArrowHelper(

            direction,

            new THREE.Vector3(
                x - 0.5,
                y,
                0
            ),

            1,

            0xffffff,

            0.25,

            0.15

        );


    networkGroup.add(
        arrow
    );

}


/* =========================================================
   DATA PACKET
========================================================= */

function createDataPacket(
    x1,
    y1,
    x2,
    y2
) {

    const geometry =
        new THREE.SphereGeometry(
            0.09,
            12,
            12
        );


    const material =
        new THREE.MeshBasicMaterial({

            color: 0xffffff

        });


    const packet =
        new THREE.Mesh(
            geometry,
            material
        );


    packet.position.set(
        x1,
        y1,
        0.25
    );


    networkGroup.add(
        packet
    );


    packets.push({

        mesh: packet,

        start: new THREE.Vector3(
            x1,
            y1,
            0.25
        ),

        end: new THREE.Vector3(
            x2,
            y2,
            0.25
        ),

        progress:
            Math.random()

    });

}


/* =========================================================
   TEXT SPRITE
========================================================= */

function createTextSprite(
    text,
    size
) {

    const canvas =
        document.createElement(
            "canvas"
        );


    canvas.width = 1024;
    canvas.height = 256;


    const ctx =
        canvas.getContext(
            "2d"
        );


    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    ctx.fillStyle =
        "rgba(0,0,0,0.72)";


    ctx.roundRect(
        20,
        30,
        984,
        190,
        30
    );


    ctx.fill();


    ctx.fillStyle =
        "white";


    ctx.font =
        "bold 80px Arial";


    ctx.textAlign =
        "center";


    ctx.textBaseline =
        "middle";


    ctx.fillText(
        text,
        512,
        125
    );


    const texture =
        new THREE.CanvasTexture(
            canvas
        );


    texture.needsUpdate =
        true;


    const material =
        new THREE.SpriteMaterial({

            map: texture,

            transparent: true

        });


    const sprite =
        new THREE.Sprite(
            material
        );


    sprite.scale.set(
        2.2 * size,
        0.55 * size,
        1
    );


    return sprite;

}


/* =========================================================
   ANIMATION
========================================================= */

function animate() {

    requestAnimationFrame(
        animate
    );


    const elapsed =
        clock.getElapsedTime();


    /* ROTATE NETWORK SLIGHTLY */

    if (networkGroup) {

        networkGroup.rotation.y =
            Math.sin(
                elapsed * 0.35
            ) * 0.08;

    }


    /* MOVE DATA PACKETS */

    packets.forEach(
        packet => {

            packet.progress +=
                0.008;


            if (
                packet.progress > 1
            ) {

                packet.progress = 0;

            }


            packet.mesh.position.lerpVectors(

                packet.start,

                packet.end,

                packet.progress

            );

        }
    );


    renderer.render(
        scene,
        camera3D
    );

}


/* =========================================================
   RESIZE
========================================================= */

function resize() {

    camera3D.aspect =
        window.innerWidth /
        window.innerHeight;


    camera3D.updateProjectionMatrix();


    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

}

</script>

</body>
</html>
