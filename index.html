<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Neural Network AR TLM</title>

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
}

#title{
    position:fixed;
    top:10px;
    left:50%;
    transform:translateX(-50%);
    z-index:10;
    width:92%;
    max-width:600px;
    padding:12px;
    background:rgba(0,0,0,0.82);
    color:white;
    border-radius:12px;
    text-align:center;
    font-size:17px;
}

#hint{
    position:fixed;
    bottom:12px;
    left:50%;
    transform:translateX(-50%);
    z-index:10;
    padding:10px 16px;
    background:white;
    color:#111;
    border-radius:20px;
    font-size:13px;
}
</style>
</head>

<body>

<div id="title">
<b>ARTIFICIAL NEURAL NETWORK</b><br>
Input Layer → Hidden Layers → Output Layer
</div>

<div id="hint">
Point the camera at the Hiro marker
</div>

<a-scene
    embedded
    vr-mode-ui="enabled:false"
    renderer="antialias:true"
    arjs="sourceType:webcam; debugUIEnabled:false;">

<a-marker preset="hiro">

<!-- ================================================= -->
<!-- TITLE -->
<!-- ================================================= -->

<a-text
    value="NEURAL NETWORK"
    position="0 3.5 0"
    rotation="-90 0 0"
    align="center"
    width="6"
    color="#FFFFFF">
</a-text>

<a-text
    value="DATA FLOWS FROM INPUT TO OUTPUT"
    position="0 3.05 0"
    rotation="-90 0 0"
    align="center"
    width="4.5"
    color="#00FFFF">
</a-text>


<!-- ================================================= -->
<!-- INPUT LAYER -->
<!-- ================================================= -->

<a-text
    value="INPUT LAYER"
    position="-4 2.5 0"
    rotation="-90 0 0"
    align="center"
    width="3"
    color="#00FFFF">
</a-text>

<a-text
    value="Features / Pixels"
    position="-4 2.05 0"
    rotation="-90 0 0"
    align="center"
    width="2"
    color="#FFFFFF">
</a-text>

<!-- Input neurons -->

<a-sphere id="i1"
    position="-4 1.4 0"
    radius=".22"
    color="#00FFFF">
</a-sphere>

<a-sphere id="i2"
    position="-4 .8 0"
    radius=".22"
    color="#00FFFF">
</a-sphere>

<a-sphere id="i3"
    position="-4 .2 0"
    radius=".22"
    color="#00FFFF">
</a-sphere>

<a-sphere id="i4"
    position="-4 -.4 0"
    radius=".22"
    color="#00FFFF">
</a-sphere>


<!-- ================================================= -->
<!-- HIDDEN LAYER 1 -->
<!-- ================================================= -->

<a-text
    value="HIDDEN LAYER 1"
    position="-1.5 2.5 0"
    rotation="-90 0 0"
    align="center"
    width="3"
    color="#FFD700">
</a-text>

<a-text
    value="Feature Detection"
    position="-1.5 2.05 0"
    rotation="-90 0 0"
    align
