<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Markerless AR - Neural Network TLM</title>

<style>
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: Arial, sans-serif;
        background: #000;
    }

    canvas {
        display: block;
    }

    #topInfo {
        position: fixed;
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;

        width: 88%;
        max-width: 430px;

        padding: 10px 14px;
        border-radius: 14px;

        background: rgba(0,0,0,0.72);
        color: white;
        text-align: center;

        font-size: 14px;
        line-height: 1.4;

        pointer-events: none;
    }

    #title {
        font-size: 18px;
        font-weight: bold;
    }

    #status {
        margin-top: 4px;
        font-size: 13px;
    }

    #startAR {
        position: fixed;
        bottom: 28px;
        left: 50%;
        transform: translateX(-50%);

        z-index: 20;

        border: none;
        border-radius: 30px;

        padding: 15px 30px;

        background: #ffffff;
        color: #111;

        font-size: 17px;
        font-weight: bold;

        box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }

    #flowButton {
        display: none;

        position: fixed;
        bottom: 28px;
        left: 50%;
        transform: translateX(-50%);

        z-index: 20;

        border: none;
        border-radius: 30px;

        padding: 13px 25px;

        background: #00e5ff;
        color: #001015;

        font-size: 15px;
        font-weight: bold;
    }

    #message {
        display: none;

        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);

        width: 80%;
        max-width: 350px;

        padding: 20px;

        border-radius: 15px;

        background: rgba(0,0,0,0.85);
        color: white;

        text-align: center;

        z-index: 30;
    }
</style>
</head>

<body>

<div id="topInfo">
    <div id="title">ARTIFICIAL NEURAL NETWORK</div>
    <div id="status">
        Tap START AR and scan a flat surface.
    </div>
</div>

<button id="startAR">START AR</button>

<button id="flowButton">
    START DATA FLOW
</button>

<div id="message"></div>


<script type="module">

import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';


/* ============================================================
   BASIC VARIABLES
   ============================================================ */

let scene;
let camera;
let renderer;

let controller;

let reticle;
let hitTestSource = null;
let hitTestSourceRequested = false;

let networkGroup;

let networkPlaced = false;
let dataFlowRunning = false;

const particles = [];

const statusText =
    document.getElementById("status");

const startButton =
    document.getElementById("startAR");

const flowButton =
    document.getElementById("flowButton");

const messageBox =
    document.getElementById("message");


/* ============================================================
   INITIALISE THREE.JS
   ============================================================ */

function init() {

    scene = new THREE.Scene();

    camera = new THREE.PerspectiveCamera(
        70,
        window.innerWidth / window.innerHeight,
        0.01,
        20
    );


    renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: true,
        powerPreference: "high-performance"
    });

    renderer.setPixelRatio(
        Math.min(window.devicePixelRatio, 2)
    );

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    renderer.xr.enabled = true;

    document.body.appendChild(
        renderer.domElement
    );


    /* ========================================================
       LIGHTING
       ======================================================== */

    const hemisphereLight =
        new THREE.HemisphereLight(
            0xffffff,
            0x444444,
            2
        );

    scene.add(hemisphereLight);


    const directionalLight =
        new THREE.DirectionalLight(
            0xffffff,
            2
        );

    directionalLight.position.set(
        2,
        4,
        2
    );

    scene.add(directionalLight);


    /* ========================================================
       RETICLE
       ======================================================== */

    const reticleGeometry =
        new THREE.RingGeometry(
            0.08,
            0.11,
            32
        );

    reticleGeometry.rotateX(
        -Math.PI / 2
    );

    const reticleMaterial =
        new THREE.MeshBasicMaterial({
            color: 0x00ffff
        });

    reticle =
        new THREE.Mesh(
            reticleGeometry,
            reticleMaterial
        );

    reticle.matrixAutoUpdate = false;
    reticle.visible = false;

    scene.add(reticle);


    /* ========================================================
       CONTROLLER
       ======================================================== */

    controller =
        renderer.xr.getController(0);

    controller.addEventListener(
        "select",
        placeNetwork
    );

    scene.add(controller);


    window.addEventListener(
        "resize",
        onWindowResize
    );


    animate();
}


/* ============================================================
   START AR
   ============================================================ */

startButton.addEventListener(
    "click",
    startAR
);


async function startAR() {

    if (!navigator.xr) {

        showMessage(
            "WebXR is not available in this browser.<br><br>" +
            "Please open this page in a browser/device " +
            "that supports AR."
        );

        return;
    }


    try {

        const supported =
            await navigator.xr.isSessionSupported(
                "immersive-ar"
            );


        if (!supported) {

            showMessage(
                "Markerless AR is not supported " +
                "on this browser/device."
            );

            return;
        }


        const session =
            await navigator.xr.requestSession(
                "immersive-ar",
                {
                    requiredFeatures: [
                        "hit-test"
                    ],

                    optionalFeatures: [
                        "dom-overlay"
                    ],

                    domOverlay: {
                        root: document.body
                    }
                }
            );


        renderer.xr.setReferenceSpaceType(
            "local"
        );

        await renderer.xr.setSession(
            session
        );


        startButton.style.display =
            "none";


        statusText.innerHTML =
            "Move your phone slowly to detect a flat surface.";


        session.addEventListener(
            "end",
            () => {

                hitTestSource = null;
                hitTestSourceRequested =
                    false;

                networkPlaced = false;

                networkGroup =
                    null;

                particles.length = 0;

                flowButton.style.display =
                    "none";

                startButton.style.display =
                    "block";

                statusText.innerHTML =
                    "Tap START AR and scan a flat surface.";
            }
        );

    }

    catch (error) {

        console.error(error);

        showMessage(
            "AR could not be started.<br><br>" +
            error.message
        );
    }
}


/* ============================================================
   PLACE NEURAL NETWORK
   ============================================================ */

function placeNetwork() {

    if (!reticle.visible) {
        return;
    }


    if (networkPlaced) {
        return;
    }


    networkGroup =
        createNeuralNetwork();


    const position =
        new THREE.Vector3();

    position.setFromMatrixPosition(
        reticle.matrix
    );


    /*
       Put the network slightly above
       the detected surface.
    */

    networkGroup.position.copy(
        position
    );

    networkGroup.position.y += 0.02;


    /*
       The network stands upright.
       We deliberately do NOT copy the
       horizontal reticle rotation.
    */

    networkGroup.rotation.set(
        0,
        0,
        0
    );


    scene.add(
        networkGroup
    );


    networkPlaced = true;


    reticle.visible = false;


    statusText.innerHTML =
        "Neural network placed. Watch the data move through the layers.";


    flowButton.style.display =
        "block";


    /*
       Start automatically.
    */

    startDataFlow();
}


/* ============================================================
   CREATE NEURAL NETWORK
   ============================================================ */

function createNeuralNetwork() {

    const group =
        new THREE.Group();


    /*
       Layer positions.

       Input
          ↓
       Hidden 1
          ↓
       Hidden 2
          ↓
       Output
    */

    const layerX = [
        -0.72,
        -0.24,
         0.24,
         0.72
    ];


    /*
       Neuron Y positions.
    */

    const layers = [

        [-0.30, -0.10, 0.10, 0.30],

        [-0.36, -0.18, 0.00, 0.18, 0.36],

        [-0.30, -0.10, 0.10, 0.30],

        [-0.15, 0.15]

    ];


    const neurons = [];


    /* ========================================================
       CREATE NEURONS
       ======================================================== */

    for (
        let layerIndex = 0;
        layerIndex < layers.length;
        layerIndex++
    ) {

        const layerNeurons = [];


        for (
            let neuronIndex = 0;
            neuronIndex < layers[layerIndex].length;
            neuronIndex++
        ) {

            const x =
                layerX[layerIndex];

            const y =
                layers[layerIndex][neuronIndex];


            const neuron =
                createNeuron(
                    x,
                    y,
                    layerIndex,
                    neuronIndex
                );


            group.add(
                neuron
            );


            layerNeurons.push(
                new THREE.Vector3(
                    x,
                    y,
                    0
                )
            );
        }


        neurons.push(
            layerNeurons
        );
    }


    /* ========================================================
       CONNECTIONS
       ======================================================== */

    for (
        let layer = 0;
        layer < neurons.length - 1;
        layer++
    ) {

        for (
            let a = 0;
            a < neurons[layer].length;
            a++
        ) {

            for (
                let b = 0;
                b < neurons[layer + 1].length;
                b++
            ) {

                createConnection(
                    group,
                    neurons[layer][a],
                    neurons[layer + 1][b]
                );
            }
        }
    }


    /* ========================================================
       LAYER HEADINGS
       ======================================================== */

    addText(
        group,
        "INPUT LAYER",
        layerX[0],
        0.52,
        0,
        0.20
    );


    addText(
        group,
        "HIDDEN LAYER 1",
        layerX[1],
        0.55,
        0,
        0.17
    );


    addText(
        group,
        "HIDDEN LAYER 2",
        layerX[2],
        0.55,
        0,
        0.17
    );


    addText(
        group,
        "OUTPUT LAYER",
        layerX[3],
        0.52,
        0,
        0.20
    );


    /* ========================================================
       EXPLANATION LABELS
       ======================================================== */

    addText(
        group,
        "PIXELS / FEATURES",
        layerX[0],
        -0.48,
        0,
        0.105
    );


    addText(
        group,
        "FEATURES",
        layerX[1],
        -0.48,
        0,
        0.105
    );


    addText(
        group,
        "PATTERNS",
        layerX[2],
        -0.48,
        0,
        0.105
    );


    addText(
        group,
        "PREDICTION",
        layerX[3],
        -0.48,
        0,
        0.105
    );


    /* ========================================================
       OUTPUT EXAMPLE
       ======================================================== */

    addText(
        group,
        "CAT 92%",
        0.72,
        0.02,
        0.08,
        0.095
    );


    addText(
        group,
        "DOG 8%",
        0.72,
        -0.28,
        0.08,
        0.095
    );


    /* ========================================================
       MAIN TITLE
       ======================================================== */

    addText(
        group,
        "HOW A NEURAL NETWORK PROCESSES DATA",
        0,
        0.82,
        0,
        0.15
    );


    return group;
}


/* ============================================================
   CREATE NEURON
   ============================================================ */

function createNeuron(
    x,
    y,
    layerIndex,
    neuronIndex
) {

    const geometry =
        new THREE.SphereGeometry(
            0.055,
            24,
            24
        );


    let color;


    if (layerIndex === 0) {

        color = 0x00e5ff;

    }

    else if (
        layerIndex === 1
    ) {

        color = 0xffc400;

    }

    else if (
        layerIndex === 2
    ) {

        color = 0xff7b00;

    }

    else {

        color = 0x00ff88;

    }


    const material =
        new THREE.MeshStandardMaterial({

            color: color,

            emissive: color,

            emissiveIntensity: 0.35,

            roughness: 0.25,

            metalness: 0.1
        });


    const neuron =
        new THREE.Mesh(
            geometry,
            material
        );


    neuron.position.set(
        x,
        y,
        0
    );


    /*
       Add small neuron number.
    */

    addText(
        neuron,
        String(neuronIndex + 1),
        0,
        0,
        0.07,
        0.07
    );


    return neuron;
}


/* ============================================================
   CREATE CONNECTION
   ============================================================ */

function createConnection(
    group,
    start,
    end
) {

    const points = [

        start.clone(),

        end.clone()

    ];


    const geometry =
        new THREE.BufferGeometry()
            .setFromPoints(points);


    const material =
        new THREE.LineBasicMaterial({

            color: 0x88aaff,

            transparent: true,

            opacity: 0.35
        });


    const line =
        new THREE.Line(
            geometry,
            material
        );


    group.add(
        line
    );


    /*
       Create moving data particle.
    */

    const particleGeometry =
        new THREE.SphereGeometry(
            0.018,
            10,
            10
        );


    const particleMaterial =
        new THREE.MeshBasicMaterial({
            color: 0xffffff
        });


    const particle =
        new THREE.Mesh(
            particleGeometry,
            particleMaterial
        );


    particle.position.copy(
        start
    );


    group.add(
        particle
    );


    particles.push({

        mesh: particle,

        start: start.clone(),

        end: end.clone(),

        offset:
            Math.random(),

        speed:
            0.7 + Math.random() * 0.5
    });
}


/* ============================================================
   TEXT SPRITE
   ============================================================ */

function addText(
    parent,
    text,
    x,
    y,
    z,
    size
) {

    const canvas =
        document.createElement(
            "canvas"
        );


    canvas.width = 1024;
    canvas.height = 256;


    const context =
        canvas.getContext("2d");


    context.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    context.font =
        "bold 90px Arial";


    context.textAlign =
        "center";


    context.textBaseline =
        "middle";


    context.fillStyle =
        "white";


    context.strokeStyle =
        "black";


    context.lineWidth =
        12;


    context.strokeText(
        text,
        512,
        128
    );


    context.fillText(
        text,
        512,
        128
    );


    const texture =
        new THREE.CanvasTexture(
            canvas
        );


    texture.needsUpdate = true;


    const material =
        new THREE.SpriteMaterial({

            map: texture,

            transparent: true,

            depthTest: false
        });


    const sprite =
        new THREE.Sprite(
            material
        );


    sprite.position.set(
        x,
        y,
        z
    );


    sprite.scale.set(
        size * 2.4,
        size * 0.6,
        1
    );


    parent.add(
        sprite
    );


    return sprite;
}


/* ============================================================
   DATA FLOW BUTTON
   ============================================================ */

flowButton.addEventListener(
    "click",
    () => {

        if (
            dataFlowRunning
        ) {

            dataFlowRunning =
                false;

            flowButton.innerText =
                "START DATA FLOW";

            statusText.innerHTML =
                "Data flow paused.";

        }

        else {

            startDataFlow();
        }
    }
);


function startDataFlow() {

    dataFlowRunning =
        true;

    flowButton.innerText =
        "PAUSE DATA FLOW";

    statusText.innerHTML =
        "Data is moving from Input → Hidden → Output.";
}


/* ============================================================
   UPDATE PARTICLES
   ============================================================ */

function updateParticles(
    time
) {

    if (
        !dataFlowRunning
    ) {
        return;
    }


    for (
        const particle of particles
    ) {

        let progress =
            (
                time * 0.001 *
                particle.speed +
                particle.offset
            ) % 1;


        /*
           Smooth movement.
        */

        const position =
            new THREE.Vector3();


        position.lerpVectors(
            particle.start,
            particle.end,
            progress
        );


        particle.mesh.position.copy(
            position
        );
    }
}


/* ============================================================
   AR HIT TEST
   ============================================================ */

function handleHitTest(
    timestamp,
    frame
) {

    if (
        !frame
    ) {
        return;
    }


    const session =
        renderer.xr.getSession();


    const referenceSpace =
        renderer.xr.getReferenceSpace();


    if (
        !session ||
        !referenceSpace
    ) {
        return;
    }


    if (
        !hitTestSourceRequested
    ) {

        session
            .requestReferenceSpace(
                "viewer"
            )
            .then(
                viewerSpace => {

                    session
                        .requestHitTestSource({
                            space:
                                viewerSpace
                        })
                        .then(
                            source => {

                                hitTestSource =
                                    source;
                            }
                        );
                }
            );


        session.addEventListener(
            "end",
            () => {

                hitTestSource = null;

                hitTestSourceRequested =
                    false;
            }
        );


        hitTestSourceRequested =
            true;
    }


    if (
        hitTestSource &&
        !networkPlaced
    ) {

        const hitTestResults =
            frame.getHitTestResults(
                hitTestSource
            );


        if (
            hitTestResults.length > 0
        ) {

            const hit =
                hitTestResults[0];


            const pose =
                hit.getPose(
                    referenceSpace
                );


            if (pose) {

                reticle.visible =
                    true;

                reticle.matrix.fromArray(
                    pose.transform.matrix
                );


                statusText.innerHTML =
                    "Surface detected — TAP to place the neural network.";
            }

        }

        else {

            reticle.visible =
                false;


            statusText.innerHTML =
                "Move your phone slowly to find a flat surface.";
        }
    }
}


/* ============================================================
   ANIMATION LOOP
   ============================================================ */

function animate() {

    renderer.setAnimationLoop(
        render
    );
}


function render(
    timestamp,
    frame
) {

    handleHitTest(
        timestamp,
        frame
    );


    updateParticles(
        timestamp
    );


    renderer.render(
        scene,
        camera
    );
}


/* ============================================================
   RESIZE
   ============================================================ */

function onWindowResize() {

    camera.aspect =
        window.innerWidth /
        window.innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );
}


/* ============================================================
   ERROR MESSAGE
   ============================================================ */

function showMessage(
    text
) {

    messageBox.innerHTML =
        text;

    messageBox.style.display =
        "block";


    setTimeout(
        () => {

            messageBox.style.display =
                "none";

        },
        5000
    );
}


/* ============================================================
   START
   ============================================================ */

init();

</script>

</body>
</html>
