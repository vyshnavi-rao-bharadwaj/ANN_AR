<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width,
                 initial-scale=1,
                 maximum-scale=1,
                 user-scalable=no">

  <title>Neural Network AR TLM</title>

  <!-- Google model-viewer -->
  <script type="module"
          src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
  </script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #10131a;
      font-family: Arial, sans-serif;
      color: white;
      overflow: hidden;
    }

    model-viewer {
      width: 100vw;
      height: 100vh;
      background: #10131a;
    }

    #title {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;

      background: rgba(0,0,0,0.72);
      padding: 12px 20px;

      border-radius: 12px;

      text-align: center;

      font-size: 20px;
      font-weight: bold;

      pointer-events: none;
    }

    #subtitle {
      display: block;
      font-size: 13px;
      font-weight: normal;
      margin-top: 4px;
    }

    #info {
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);

      z-index: 10;

      background: rgba(0,0,0,0.75);

      padding: 12px 18px;

      border-radius: 12px;

      text-align: center;

      font-size: 14px;

      max-width: 90%;
    }

    #ar-button {
      position: fixed;

      left: 50%;
      bottom: 90px;

      transform: translateX(-50%);

      z-index: 20;

      border: none;

      border-radius: 30px;

      padding: 15px 28px;

      background: #ffffff;

      color: #111111;

      font-size: 17px;

      font-weight: bold;

      box-shadow: 0 5px 20px rgba(0,0,0,0.4);

      cursor: pointer;
    }

    #ar-button:active {
      transform: translateX(-50%) scale(0.96);
    }

  </style>

</head>

<body>

  <div id="title">

    NEURAL NETWORK

    <span id="subtitle">
      AI Teaching-Learning Material
    </span>

  </div>


  <model-viewer

      src="neural_network_tlm.glb"

      alt="3D Neural Network Teaching Learning Material"

      ar

      ar-modes="scene-viewer"

      ar-placement="floor"

      camera-controls

      touch-action="pan-y"

      shadow-intensity="1"

      shadow-softness="0.8"

      exposure="1"

      environment-image="neutral"

      camera-orbit="0deg 75deg 3m"

      min-camera-orbit="auto auto 1m"

      max-camera-orbit="auto auto 10m"

      interaction-prompt="auto"

      disable-pan

      style="width:100%;height:100%;">

    <button
      slot="ar-button"
      id="ar-button">

      VIEW IN AR

    </button>

  </model-viewer>


  <div id="info">

    Scan a flat surface and tap to place the
    Neural Network.

  </div>


  <script>

    const modelViewer =
      document.querySelector("model-viewer");

    const info =
      document.getElementById("info");


    modelViewer.addEventListener(
      "ar-status",
      function(event) {

        if (event.detail.status === "session-started") {

          info.innerHTML =
            "Move your phone slowly to scan the surface.<br>" +
            "Tap the screen to place the Neural Network.";

        }

        else if (event.detail.status === "object-placed") {

          info.innerHTML =
            "Neural Network placed.<br>" +
            "Move around it to explore the layers.";

        }

        else if (event.detail.status === "failed") {

          info.innerHTML =
            "AR could not start on this device.";

        }

      }
    );

  </script>

</body>

</html>
