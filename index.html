<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<title>Neural Network - Markerless AR TLM</title>

<style>
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: Arial, sans-serif;
        background: #111;
    }

    #info {
        position: fixed;
        top: 15px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        width: 90%;
        max-width: 500px;
        text-align: center;
        color: white;
        background: rgba(0,0,0,0.75);
        padding: 12px;
        border-radius: 12px;
        box-sizing: border-box;
    }

    #title {
        font-size: 21px;
        font-weight: bold;
        margin-bottom: 5px;
    }

    #message {
        font-size: 14px;
        line-height: 1.4;
    }

    #startAR {
        position: fixed;
        left: 50%;
        bottom: 35px;
        transform: translateX(-50%);
        z-index: 20;

        border: none;
        border-radius: 30px;
        padding: 16px 28px;
        font-size: 18px;
        font-weight: bold;
        color: white;
        background: #1976d2;
        box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }

    #placeButton {
        display: none;
        position: fixed;
        left: 50%;
        bottom: 35px;
        transform: translateX(-50%);
        z-index: 20;

        border: none;
        border-radius: 30px;
        padding: 15px 28px;
        font-size: 17px;
        font-weight: bold;
        color: white;
        background: #2e7d32;
    }

    #error {
        display: none;
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        z-index: 30;

        width: 85%;
        max-width: 450px;
        padding: 20px;
        border-radius: 15px;
        background: rgba(0,0,0,0.9);
        color: white;
        text-align: center;
        line-height: 1.5;
    }
</style>
</head>

<body>

<div id="info">
    <div id="title">🧠 NEURAL NETWORK</div>
    <div id="message">
        Tap ENTER AR and point your camera at a table or floor.
        When a surface is detected, tap PLACE MODEL.
    </div>
</div>

<button id="startAR">ENTER AR</button>
<button id="placeButton">PLACE MODEL</button>

<div id="error"></div>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

import { ARButton } from
"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/webxr/ARButton.js";


/* -------------------------------------------------------
   BASIC THREE.JS SETUP
------------------------------------------------------- */

let camera;
let scene;
let renderer;

let controller;
let reticle;

let hitTestSource = null;
let hitTestSourceRequested = false;

let model = null;
let modelPlaced = false;


/* -------------------------------------------------------
   SCENE
------------------------------------------------------- */

scene = new THREE.Scene();

camera = new THREE.PerspectiveCamera(
    70,
    window.innerWidth / window.innerHeight,
    0.01,
    20
);


/* -------------------------------------------------------
   LIGHTS
------------------------------------------------------- */

const light1 = new THREE.HemisphereLight(
    0xffffff,
    0x444444,
    2.5
);

scene.add(light1);

const light2 = new THREE.DirectionalLight(
    0xffffff,
    2
);

light2.position.set(2,4,2);

scene.add(light2);


/* -------------------------------------------------------
   RENDERER
------------------------------------------------------- */

renderer = new THREE.WebGLRenderer({
    antialias: true,
    alpha: true
});

renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);

renderer.xr.enabled = true;

renderer.outputColorSpace = THREE.SRGBColorSpace;

document.body.appendChild(renderer.domElement);


/* -------------------------------------------------------
   AR BUTTON
------------------------------------------------------- */

const arButton = ARButton.createButton(
    renderer,
    {
        requiredFeatures: ["hit-test"],
        optionalFeatures: ["dom-overlay"],
        domOverlay: {
            root: document.body
        }
    }
);

arButton.style.display = "none";

document.body.appendChild(arButton);

document.getElementById("startAR").onclick = function() {

    if (!navigator.xr) {

        showError(
            "Markerless AR is not supported by this browser/device.<br><br>" +
            "Try Chrome on an Android phone with ARCore support."
        );

        return;
    }

    arButton.click();
};


/* -------------------------------------------------------
   RETICLE
------------------------------------------------------- */

const reticleGeometry =
    new THREE.RingGeometry(
        0.08,
        0.10,
        32
    ).rotateX(-Math.PI / 2);

const reticleMaterial =
    new THREE.MeshBasicMaterial({
        color: 0x00ff88
    });

reticle = new THREE.Mesh(
    reticleGeometry,
    reticleMaterial
);

reticle.matrixAutoUpdate = false;

reticle.visible = false;

scene.add(reticle);


/* -------------------------------------------------------
   CONTROLLER
------------------------------------------------------- */

controller = renderer.xr.getController(0);

controller.addEventListener(
    "select",
    function() {

        if (!reticle.visible) return;

        if (!modelPlaced) {

            createNeuralNetwork();

            model.position.setFromMatrixPosition(
                reticle.matrix
            );

            modelPlaced = true;

            document.getElementById(
                "placeButton"
            ).style.display = "none";

            document.getElementById(
                "message"
            ).innerHTML =
                "Neural Network placed!<br>" +
                "Watch the data move from Input → Hidden Layers → Output.";

        }

    }
);

scene.add(controller);


/* -------------------------------------------------------
   CREATE NEURAL NETWORK
------------------------------------------------------- */

function createNeuralNetwork() {

    model = new THREE.Group();

    /*
       NETWORK STRUCTURE

       INPUT
          ↓
       HIDDEN 1
          ↓
       HIDDEN 2
          ↓
       OUTPUT
    */

    const layers = [

        {
            x: -0.75,
            name: "INPUT LAYER",
            neurons: 4
        },

        {
            x: -0.25,
            name: "HIDDEN LAYER 1",
            neurons: 5
        },

        {
            x: 0.25,
            name: "HIDDEN LAYER 2",
            neurons: 5
        },

        {
            x: 0.75,
            name: "OUTPUT LAYER",
            neurons: 2
        }

    ];


    const neuronPositions = [];


    /* ---------------------------------------------------
       NEURONS
    --------------------------------------------------- */

    layers.forEach((layer, layerIndex) => {

        const positions = [];

        const spacing = 0.25;

        const totalHeight =
            (layer.neurons - 1) * spacing;

        for (
            let i = 0;
            i < layer.neurons;
            i++
        ) {

            const y =
                totalHeight / 2 -
                i * spacing;

            const z = 0;

            const geometry =
                new THREE.SphereGeometry(
                    0.065,
                    24,
                    24
                );

            const material =
                new THREE.MeshStandardMaterial({

                    color:
                        layerIndex === 0
                            ? 0x2196f3

                        : layerIndex === 3
                            ? 0xff9800

                        : 0x9c27b0,

                    emissive:
                        layerIndex === 0
                            ? 0x003b70

                        : layerIndex === 3
                            ? 0x6b3500

                        : 0x3d0050,

                    emissiveIntensity: 0.7

                });

            const neuron =
                new THREE.Mesh(
                    geometry,
                    material
                );

            neuron.position.set(
                layer.x,
                y,
                z
            );

            model.add(neuron);

            positions.push(
                neuron.position.clone()
            );
        }

        neuronPositions.push(positions);


        /* ------------------------------------------------
           LAYER LABEL
        ------------------------------------------------ */

        const label =
            createTextSprite(
                layer.name,
                0.14
            );

        label.position.set(
            layer.x,
            totalHeight / 2 + 0.25,
            0
        );

        model.add(label);

    });


    /* ---------------------------------------------------
       CONNECTIONS
    --------------------------------------------------- */

    for (
        let l = 0;
        l < neuronPositions.length - 1;
        l++
    ) {

        const current =
            neuronPositions[l];

        const next =
            neuronPositions[l + 1];

        current.forEach(start => {

            next.forEach(end => {

                createConnection(
                    start,
                    end
                );

            });

        });

    }


    /* ---------------------------------------------------
       INPUT / OUTPUT EXPLANATION
    --------------------------------------------------- */

    const inputText =
        createTextSprite(
            "DATA\nINPUT",
            0.12
        );

    inputText.position.set(
        -0.75,
        -0.65,
        0
    );

    model.add(inputText);


    const outputText =
        createTextSprite(
            "PREDICTION\nOUTPUT",
            0.12
        );

    outputText.position.set(
        0.75,
        -0.55,
        0
    );

    model.add(outputText);


    /* ---------------------------------------------------
       DATA PARTICLES
    --------------------------------------------------- */

    for (let i = 0; i < 12; i++) {

        createDataParticle(
            i * 0.18
        );

    }


    /* ---------------------------------------------------
       BASE
    --------------------------------------------------- */

    const baseGeometry =
        new THREE.BoxGeometry(
            1.9,
            0.03,
            0.8
        );

    const baseMaterial =
        new THREE.MeshStandardMaterial({

            color: 0x111827,

            transparent: true,

            opacity: 0.75

        });

    const base =
        new THREE.Mesh(
            baseGeometry,
            baseMaterial
        );

    base.position.y = -0.48;

    model.add(base);


    /* ---------------------------------------------------
       MAIN TITLE
    --------------------------------------------------- */

    const title =
        createTextSprite(
            "HOW A NEURAL NETWORK LEARNS",
            0.16
        );

    title.position.set(
        0,
        0.72,
        0
    );

    model.add(title);


    scene.add(model);
}


/* -------------------------------------------------------
   CONNECTION LINE
------------------------------------------------------- */

function createConnection(start, end) {

    const direction =
        new THREE.Vector3()
            .subVectors(end, start);

    const length =
        direction.length();

    const geometry =
        new THREE.CylinderGeometry(
            0.008,
            0.008,
            length,
            8
        );

    const material =
        new THREE.MeshBasicMaterial({
            color: 0x777777,
            transparent: true,
            opacity: 0.55
        });

    const line =
        new THREE.Mesh(
            geometry,
            material
        );

    line.position.copy(start)
        .add(end)
        .multiplyScalar(0.5);

    line.quaternion.setFromUnitVectors(
        new THREE.Vector3(0,1,0),
        direction.normalize()
    );

    model.add(line);
}


/* -------------------------------------------------------
   DATA PARTICLE
------------------------------------------------------- */

function createDataParticle(delay) {

    const geometry =
        new THREE.SphereGeometry(
            0.018,
            12,
            12
        );

    const material =
        new THREE.MeshBasicMaterial({
            color: 0x00ffff
        });

    const particle =
        new THREE.Mesh(
            geometry,
            material
        );

    model.add(particle);

    particle.userData.offset = delay;

    particle.userData.speed = 0.20;

    particle.userData.progress = 0;

    particle.userData.path = [
        new THREE.Vector3(-0.75, 0, 0.05),
        new THREE.Vector3(-0.25, 0.08, 0.05),
        new THREE.Vector3(0.25, -0.08, 0.05),
        new THREE.Vector3(0.75, 0, 0.05)
    ];

    particle.position.copy(
        particle.userData.path[0]
    );

    animatedParticles.push(particle);
}


const animatedParticles = [];


/* -------------------------------------------------------
   ANIMATE DATA
------------------------------------------------------- */

function updateParticles(delta) {

    animatedParticles.forEach(
        particle => {

            particle.userData.progress +=
                delta *
                particle.userData.speed;

            let p =
                particle.userData.progress +
                particle.userData.offset;

            p = p % 1;

            const path =
                particle.userData.path;

            const segments =
                path.length - 1;

            const scaled =
                p * segments;

            const index =
                Math.floor(scaled);

            const local =
                scaled - index;

            const a =
                path[index];

            const b =
                path[
                    Math.min(
                        index + 1,
                        path.length - 1
                    )
                ];

            particle.position.lerpVectors(
                a,
                b,
                local
            );

        }
    );
}


/* -------------------------------------------------------
   TEXT SPRITE
------------------------------------------------------- */

function createTextSprite(
    text,
    size
) {

    const canvas =
        document.createElement(
            "canvas"
        );

    const ctx =
        canvas.getContext("2d");

    canvas.width = 1024;
    canvas.height = 256;

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.font =
        "bold 60px Arial";

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";

    ctx.fillStyle =
        "white";

    const lines =
        text.split("\n");

    lines.forEach(
        (line, index) => {

            ctx.fillText(
                line,
                canvas.width / 2,
                90 + index * 65
            );

        }
    );

    const texture =
        new THREE.CanvasTexture(
            canvas
        );

    texture.colorSpace =
        THREE.SRGBColorSpace;

    const material =
        new THREE.SpriteMaterial({
            map: texture,
            transparent: true
        });

    const sprite =
        new THREE.Sprite(
            material
        );

    sprite.scale.set(
        size * 3.5,
        size,
        1
    );

    return sprite;
}


/* -------------------------------------------------------
   WEBXR HIT TEST
------------------------------------------------------- */

renderer.xr.addEventListener(
    "sessionstart",
    function() {

        document.getElementById(
            "startAR"
        ).style.display = "none";

        document.getElementById(
            "placeButton"
        ).style.display = "block";

        document.getElementById(
            "message"
        ).innerHTML =
            "Move your phone slowly over a table or floor.<br>" +
            "A green circle will appear when a surface is detected.";

    }
);


renderer.xr.addEventListener(
    "sessionend",
    function() {

        hitTestSourceRequested = false;

        hitTestSource = null;

        reticle.visible = false;

        modelPlaced = false;

        if (model) {

            scene.remove(model);

            model = null;

        }

        animatedParticles.length = 0;

        document.getElementById(
            "startAR"
        ).style.display = "block";

        document.getElementById(
            "placeButton"
        ).style.display = "none";

    }
);


/* -------------------------------------------------------
   PLACE BUTTON
------------------------------------------------------- */

document.getElementById(
    "placeButton"
).onclick = function() {

    if (
        reticle.visible &&
        !modelPlaced
    ) {

        createNeuralNetwork();

        model.position.setFromMatrixPosition(
            reticle.matrix
        );

        modelPlaced = true;

        document.getElementById(
            "placeButton"
        ).style.display = "none";

        document.getElementById(
            "message"
        ).innerHTML =
            "Model placed ✓<br>" +
            "Watch the data flow through the network.";

    }

};


/* -------------------------------------------------------
   ANIMATION LOOP
------------------------------------------------------- */

let previousTime = 0;

renderer.setAnimationLoop(
    function(timestamp, frame) {

        const delta =
            Math.min(
                (timestamp - previousTime) /
                1000,
                0.05
            );

        previousTime = timestamp;

        if (frame) {

            const referenceSpace =
                renderer.xr.getReferenceSpace();

            const session =
                renderer.xr.getSession();


            if (!hitTestSourceRequested) {

                session.requestReferenceSpace(
                    "viewer"
                ).then(
                    function(referenceSpace) {

                        session.requestHitTestSource({
                            space: referenceSpace
                        }).then(
                            function(source) {

                                hitTestSource =
                                    source;

                            }
                        );

                    }
                );

                session.addEventListener(
                    "end",
                    function() {

                        hitTestSourceRequested =
                            false;

                        hitTestSource = null;

                    }
                );

                hitTestSourceRequested = true;
            }


            if (hitTestSource) {

                const results =
                    frame.getHitTestResults(
                        hitTestSource
                    );

                if (results.length > 0) {

                    const hit =
                        results[0];

                    const pose =
                        hit.getPose(
                            referenceSpace
                        );

                    reticle.visible = true;

                    reticle.matrix.fromArray(
                        pose.transform.matrix
                    );

                }
                else {

                    reticle.visible = false;

                }

            }

        }


        if (model) {

            updateParticles(delta);

        }


        renderer.render(
            scene,
            camera
        );

    }
);


/* -------------------------------------------------------
   ERROR MESSAGE
------------------------------------------------------- */

function showError(message) {

    const box =
        document.getElementById(
            "error"
        );

    box.innerHTML =
        message +
        "<br><br>" +
        "<button onclick=\"location.reload()\">" +
        "OK" +
        "</button>";

    box.style.display = "block";
}


/* -------------------------------------------------------
   RESIZE
------------------------------------------------------- */

window.addEventListener(
    "resize",
    function() {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);

</script>

</body>
</html>
