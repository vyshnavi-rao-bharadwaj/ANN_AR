<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Neural Network AR TLM</title>

<style>
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: Arial, sans-serif;
    }

    #camera {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 0;
    }

    #threeCanvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
        pointer-events: none;
    }

    #topBar {
        position: fixed;
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 5;

        padding: 7px 15px;
        border-radius: 20px;

        background: rgba(0,0,0,0.45);
        color: white;

        font-size: 16px;
        font-weight: bold;

        backdrop-filter: blur(4px);
        white-space: nowrap;
    }

    #hint {
        position: fixed;
        bottom: 12px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 5;

        padding: 6px 12px;
        border-radius: 15px;

        background: rgba(0,0,0,0.40);
        color: white;

        font-size: 12px;
        text-align: center;

        backdrop-filter: blur(3px);
        white-space: nowrap;
    }

    #startButton {
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        z-index: 10;

        border: none;
        border-radius: 28px;

        padding: 14px 24px;

        background: rgba(0,0,0,0.75);
        color: white;

        font-size: 17px;
        font-weight: bold;
    }
</style>
</head>

<body>

<video id="camera" autoplay playsinline muted></video>

<canvas id="threeCanvas"></canvas>

<div id="topBar">NEURAL NETWORK • FEED-FORWARD</div>

<div id="hint">
    Data moves layer → layer
</div>

<button id="startButton">START AR</button>


<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>

let scene;
let camera;
let renderer;

let network = new THREE.Group();

let nodes = [];
let connections = [];
let packets = [];
let weightLabels = [];

let orientationX = 0;
let orientationY = 0;


/* =========================================================
   NETWORK STRUCTURE
========================================================= */

const structure = [4, 5, 4, 1];

const layerNames = [
    "INPUT LAYER",
    "HIDDEN LAYER 1",
    "HIDDEN LAYER 2",
    "OUTPUT LAYER"
];

const layerDescriptions = [
    "IMAGE DATA",
    "FEATURE EXTRACTION",
    "PATTERN DETECTION",
    "CAT 92%"
];


/* =========================================================
   DIFFERENT LAYER COLOURS
========================================================= */

const layerColors = [
    0x00cfff,   // Input - cyan
    0x35e06f,   // Hidden 1 - green
    0xffb020,   // Hidden 2 - orange
    0xff4f81    // Output - pink
];


/* =========================================================
   SAMPLE INPUT / OUTPUT
========================================================= */

const inputData = [
    0.8,
    0.4,
    0.7,
    0.2
];

const outputData = "0.92 → CAT";


/* =========================================================
   SAMPLE WEIGHTS
========================================================= */

const weights = [

    // Input → Hidden 1
    [
        [ 0.8, -0.4,  0.6,  0.2, -0.5 ],
        [ 0.3,  0.7, -0.2,  0.5,  0.4 ],
        [-0.6,  0.2,  0.9, -0.3,  0.7 ],
        [ 0.5, -0.8,  0.4,  0.6,  0.1 ]
    ],

    // Hidden 1 → Hidden 2
    [
        [ 0.3, -0.7,  0.5,  0.4 ],
        [ 0.6,  0.2, -0.4,  0.8 ],
        [-0.5,  0.9,  0.3, -0.2 ],
        [ 0.7, -0.1,  0.6,  0.5 ],
        [ 0.2,  0.4, -0.8,  0.3 ]
    ],

    // Hidden 2 → Output
    [
        [ 0.9 ],
        [-0.4 ],
        [ 0.7 ],
        [ 0.8 ]
    ]
];


/* =========================================================
   INITIALISE
========================================================= */

function init() {

    scene = new THREE.Scene();

    camera = new THREE.PerspectiveCamera(
        55,
        window.innerWidth / window.innerHeight,
        0.1,
        100
    );

    camera.position.z = 10.5;


    renderer = new THREE.WebGLRenderer({
        canvas: document.getElementById("threeCanvas"),
        alpha: true,
        antialias: true
    });

    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );


    scene.add(network);

    buildNetwork();

    window.addEventListener(
        "resize",
        onResize
    );

    window.addEventListener(
        "deviceorientation",
        handleOrientation,
        true
    );

    animate();
}


/* =========================================================
   PORTRAIT / LANDSCAPE LAYOUT
========================================================= */

function getLayerPosition(layerIndex) {

    const portrait =
        window.innerHeight > window.innerWidth;


    if (portrait) {

        /*
            Large vertical separation between layers.
            This prevents the 5 Hidden-1 nodes from
            overlapping.
        */

        const centers = [
            3.7,
            1.2,
            -1.3,
            -3.7
        ];

        return {
            x: 0,
            y: centers[layerIndex]
        };

    } else {

        return {
            x: [-3.8, -1.3, 1.3, 3.8][layerIndex],
            y: 0
        };
    }
}


/* =========================================================
   BUILD NETWORK
========================================================= */

function buildNetwork() {

    nodes = [];
    connections = [];
    packets = [];
    weightLabels = [];

    while (network.children.length > 0) {
        network.remove(network.children[0]);
    }


    const portrait =
        window.innerHeight > window.innerWidth;


    /*
        Slight scale reduction in portrait so the entire
        network fits comfortably.
    */

    network.scale.set(
        portrait ? 0.78 : 1,
        portrait ? 0.78 : 1,
        portrait ? 0.78 : 1
    );


    /* -----------------------------------------------------
       CREATE NODES
    ----------------------------------------------------- */

    for (let l = 0; l < structure.length; l++) {

        nodes[l] = [];

        const count = structure[l];

        const center = getLayerPosition(l);

        /*
            More spacing between individual nodes.
        */

        const spacing =
            portrait ? 0.78 : 0.82;

        for (let n = 0; n < count; n++) {

            let x = center.x;
            let y = center.y;

            if (portrait) {

                y =
                    center.y +
                    (n - (count - 1) / 2) * spacing;

            } else {

                y =
                    (n - (count - 1) / 2) * spacing;
            }


            const geometry =
                new THREE.SphereGeometry(
                    0.22,
                    24,
                    24
                );


            const material =
                new THREE.MeshBasicMaterial({
                    color: layerColors[l],
                    transparent: true,
                    opacity: 0.95
                });


            const node =
                new THREE.Mesh(
                    geometry,
                    material
                );


            node.position.set(
                x,
                y,
                0
            );


            node.userData = {
                layer: l,
                index: n,
                baseScale: 1
            };


            network.add(node);

            nodes[l].push(node);
        }
    }


    /* -----------------------------------------------------
       CONNECTIONS
    ----------------------------------------------------- */

    for (let l = 0; l < structure.length - 1; l++) {

        for (let a = 0; a < structure[l]; a++) {

            for (let b = 0; b < structure[l + 1]; b++) {

                createConnection(
                    l,
                    a,
                    l + 1,
                    b
                );
            }
        }
    }


    /* -----------------------------------------------------
       LABELS
    ----------------------------------------------------- */

    createLayerLabels();

    createDataLabels();
}


/* =========================================================
   CREATE CONNECTION
========================================================= */

function createConnection(
    fromLayer,
    fromNode,
    toLayer,
    toNode
) {

    const from =
        nodes[fromLayer][fromNode].position;

    const to =
        nodes[toLayer][toNode].position;


    const geometry =
        new THREE.BufferGeometry().setFromPoints([
            from,
            to
        ]);


    const material =
        new THREE.LineBasicMaterial({
            color: 0xffffff,
            transparent: true,
            opacity: 0.20
        });


    const line =
        new THREE.Line(
            geometry,
            material
        );


    line.userData = {
        fromLayer,
        fromNode,
        toLayer,
        toNode
    };


    network.add(line);

    connections.push(line);
}


/* =========================================================
   TEXT SPRITE
========================================================= */

function makeTextSprite(
    text,
    color,
    size = 48
) {

    const canvas =
        document.createElement("canvas");

    const ctx =
        canvas.getContext("2d");

    canvas.width = 512;
    canvas.height = 128;


    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    ctx.font =
        "bold " + size + "px Arial";

    ctx.fillStyle = color;

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";


    ctx.fillText(
        text,
        canvas.width / 2,
        canvas.height / 2
    );


    const texture =
        new THREE.CanvasTexture(canvas);

    texture.needsUpdate = true;


    const material =
        new THREE.SpriteMaterial({
            map: texture,
            transparent: true
        });


    const sprite =
        new THREE.Sprite(material);


    sprite.scale.set(
        2.5,
        0.63,
        1
    );


    return sprite;
}


/* =========================================================
   LAYER LABELS
========================================================= */

function createLayerLabels() {

    const portrait =
        window.innerHeight > window.innerWidth;


    for (let l = 0; l < structure.length; l++) {

        const pos =
            getLayerPosition(l);


        const label =
            makeTextSprite(
                layerNames[l],
                "#" +
                new THREE.Color(
                    layerColors[l]
                ).getHexString(),
                42
            );


        if (portrait) {

            /*
                Labels placed to the side so they
                don't sit over the nodes.
            */

            label.position.set(
                1.45,
                pos.y,
                0.2
            );

        } else {

            label.position.set(
                pos.x,
                2.65,
                0.2
            );
        }


        network.add(label);


        const desc =
            makeTextSprite(
                layerDescriptions[l],
                "#ffffff",
                30
            );


        if (portrait) {

            desc.position.set(
                -1.45,
                pos.y,
                0.2
            );

        } else {

            desc.position.set(
                pos.x,
                -2.55,
                0.2
            );
        }


        desc.scale.set(
            2.0,
            0.5,
            1
        );


        network.add(desc);
    }
}


/* =========================================================
   DATA LABELS
========================================================= */

function createDataLabels() {

    const portrait =
        window.innerHeight > window.innerWidth;


    /* INPUT VALUES */

    const input =
        makeTextSprite(
            "x = [0.8, 0.4, 0.7, 0.2]",
            "#ffffff",
            26
        );


    if (portrait) {

        input.position.set(
            -1.35,
            4.55,
            0.2
        );

    } else {

        input.position.set(
            -3.8,
            -2.95,
            0.2
        );
    }


    input.scale.set(
        2.5,
        0.5,
        1
    );

    network.add(input);


    /* OUTPUT */

    const output =
        makeTextSprite(
            "y = " + outputData,
            "#ffffff",
            30
        );


    if (portrait) {

        output.position.set(
            -1.35,
            -4.55,
            0.2
        );

    } else {

        output.position.set(
            3.8,
            -2.95,
            0.2
        );
    }


    output.scale.set(
        2.3,
        0.55,
        1
    );

    network.add(output);


    /* FEED FORWARD */

    const feed =
        makeTextSprite(
            "FEED-FORWARD →",
            "#ffffff",
            30
        );


    if (portrait) {

        feed.position.set(
            0,
            5.05,
            0.2
        );

    } else {

        feed.position.set(
            0,
            3.35,
            0.2
        );
    }


    feed.scale.set(
        2.0,
        0.5,
        1
    );

    network.add(feed);
}


/* =========================================================
   ANIMATION STATE
========================================================= */

let currentLayer = 0;
let currentNode = 0;

let burstStart = 0;

const BURST_DURATION = 1000;
const NODE_PAUSE = 250;

let state = "sending";


/* =========================================================
   START BURST
========================================================= */

function startBurst() {

    clearPackets();

    clearWeightLabels();


    const active =
        nodes[currentLayer][currentNode];


    /* Active node glow */

    active.scale.set(
        1.45,
        1.45,
        1.45
    );


    active.material.opacity = 1;


    /*
        If there is a next layer:
        SEND TO EVERY NODE.
    */

    if (currentLayer < structure.length - 1) {

        sendToEveryNextNode(
            currentLayer,
            currentNode
        );
    }


    burstStart = performance.now();

    state = "sending";
}


/* =========================================================
   SEND TO EVERY NODE OF NEXT LAYER
========================================================= */

function sendToEveryNextNode(
    layer,
    sourceIndex
) {

    const nextLayer =
        layer + 1;


    const source =
        nodes[layer][sourceIndex];


    for (
        let targetIndex = 0;
        targetIndex < nodes[nextLayer].length;
        targetIndex++
    ) {

        const target =
            nodes[nextLayer][targetIndex];


        const packetGeometry =
            new THREE.SphereGeometry(
                0.11,
                16,
                16
            );


        /*
            Packet takes the destination layer colour.
        */

        const packetMaterial =
            new THREE.MeshBasicMaterial({
                color: layerColors[nextLayer],
                transparent: true,
                opacity: 1
            });


        const packet =
            new THREE.Mesh(
                packetGeometry,
                packetMaterial
            );


        packet.position.copy(
            source.position
        );


        packet.userData = {

            from: source.position.clone(),

            to: target.position.clone(),

            startTime: performance.now(),

            duration: BURST_DURATION,

            targetIndex: targetIndex,

            layer: nextLayer
        };


        network.add(packet);

        packets.push(packet);


        /* ---------------------------------------------
           Highlight outgoing connection
        --------------------------------------------- */

        const connection =
            connections.find(c =>
                c.userData.fromLayer === layer &&
                c.userData.fromNode === sourceIndex &&
                c.userData.toLayer === nextLayer &&
                c.userData.toNode === targetIndex
            );


        if (connection) {

            connection.material.color.setHex(
                layerColors[nextLayer]
            );

            connection.material.opacity = 0.85;
        }


        /* ---------------------------------------------
           Weight shown during transmission
        --------------------------------------------- */

        const weight =
            weights[layer][sourceIndex][targetIndex];


        const weightSprite =
            makeTextSprite(
                "w = " + weight,
                "#ffffff",
                25
            );


        const mid =
            source.position.clone()
                .lerp(target.position, 0.5);


        /*
            Small offset so the weight does not
            sit directly on the connection.
        */

        weightSprite.position.set(
            mid.x + 0.18,
            mid.y + 0.15,
            0.3
        );


        weightSprite.scale.set(
            0.9,
            0.28,
            1
        );


        network.add(weightSprite);

        weightLabels.push(weightSprite);
    }
}


/* =========================================================
   UPDATE PACKETS
========================================================= */

function updatePackets(now) {

    for (let i = packets.length - 1; i >= 0; i--) {

        const packet =
            packets[i];


        const data =
            packet.userData;


        let progress =
            (now - data.startTime) /
            data.duration;


        progress =
            Math.min(
                Math.max(progress, 0),
                1
            );


        /*
            Smooth movement.
        */

        const eased =
            progress * progress *
            (3 - 2 * progress);


        packet.position.lerpVectors(
            data.from,
            data.to,
            eased
        );


        /*
            Small pulsing effect.
        */

        const pulse =
            1 +
            Math.sin(
                progress * Math.PI * 4
            ) * 0.25;


        packet.scale.set(
            pulse,
            pulse,
            pulse
        );
    }
}


/* =========================================================
   ANIMATION CONTROLLER
========================================================= */

function updateNetworkAnimation(now) {

    if (state === "sending") {

        if (
            now - burstStart >=
            BURST_DURATION
        ) {

            finishBurst();
        }
    }
}


/* =========================================================
   FINISH BURST
========================================================= */

function finishBurst() {

    clearPackets();

    clearWeightLabels();

    resetConnections();


    const active =
        nodes[currentLayer][currentNode];


    active.scale.set(
        1,
        1,
        1
    );


    /*
        Move to next node.
    */

    currentNode++;


    /*
        When all nodes of this layer
        have transmitted, move to next layer.
    */

    if (
        currentNode >=
        structure[currentLayer].length
    ) {

        currentNode = 0;

        currentLayer++;


        /*
            After output, restart from input.
        */

        if (
            currentLayer >=
            structure.length
        ) {

            currentLayer = 0;
        }
    }


    /*
        Small pause before next node.
    */

    state = "pause";

    setTimeout(() => {

        startBurst();

    }, NODE_PAUSE);
}


/* =========================================================
   RESET CONNECTIONS
========================================================= */

function resetConnections() {

    connections.forEach(
        connection => {

            connection.material.color.setHex(
                0xffffff
            );

            connection.material.opacity =
                0.20;
        }
    );
}


/* =========================================================
   CLEAR PACKETS
========================================================= */

function clearPackets() {

    packets.forEach(
        packet => {

            network.remove(packet);

            packet.geometry.dispose();

            packet.material.dispose();
        }
    );


    packets = [];
}


/* =========================================================
   CLEAR WEIGHT LABELS
========================================================= */

function clearWeightLabels() {

    weightLabels.forEach(
        label => {

            network.remove(label);

            if (label.material.map) {
                label.material.map.dispose();
            }

            label.material.dispose();
        }
    );


    weightLabels = [];
}


/* =========================================================
   DEVICE ORIENTATION
========================================================= */

function handleOrientation(event) {

    if (event.gamma !== null) {

        orientationX =
            Math.max(
                -45,
                Math.min(
                    45,
                    event.gamma
                )
            );
    }


    if (event.beta !== null) {

        orientationY =
            Math.max(
                -45,
                Math.min(
                    45,
                    event.beta - 45
                )
            );
    }
}


/* =========================================================
   RENDER LOOP
========================================================= */

function animate() {

    requestAnimationFrame(
        animate
    );


    const now =
        performance.now();


    updatePackets(now);

    updateNetworkAnimation(now);


    /*
        Subtle AR movement according to phone tilt.
    */

    network.rotation.y +=
        (
            orientationX * 0.003 -
            network.rotation.y
        ) * 0.04;


    network.rotation.x +=
        (
            orientationY * 0.001 -
            network.rotation.x
        ) * 0.04;


    /*
        Very subtle floating motion.
    */

    network.position.y =
        Math.sin(now * 0.0006) * 0.04;


    renderer.render(
        scene,
        camera
    );
}


/* =========================================================
   RESIZE
========================================================= */

function onResize() {

    camera.aspect =
        window.innerWidth /
        window.innerHeight;

    camera.updateProjectionMatrix();


    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );


    /*
        Rebuild because portrait and landscape
        have completely different layouts.
    */

    buildNetwork();
}


/* =========================================================
   CAMERA
========================================================= */

async function startCamera() {

    try {

        const stream =
            await navigator.mediaDevices.getUserMedia({

                video: {
                    facingMode: {
                        ideal: "environment"
                    }
                },

                audio: false
            });


        document.getElementById(
            "camera"
        ).srcObject = stream;


        document.getElementById(
            "startButton"
        ).style.display = "none";


        /*
            Start Three.js only after camera permission.
        */

        init();


        /*
            Start first transmission.
        */

        setTimeout(() => {

            startBurst();

        }, 800);


    } catch (error) {

        alert(
            "Camera access is required for this AR TLM."
        );

        console.error(error);
    }
}


/* =========================================================
   START BUTTON
========================================================= */

document.getElementById(
    "startButton"
).addEventListener(
    "click",
    startCamera
);

</script>

</body>
</html>
